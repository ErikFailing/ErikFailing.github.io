# Dependabot opens a pull request when something below has an update. Nothing changes until the
# pull request is reviewed and merged (merging deploys the site, like any push to main).
version: 2
updates:
  # Actions used by .github/workflows/hugo.yaml. Pinned to major-version tags (e.g. @v7), so
  # this only fires for new major versions. All updates arrive together in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # The PaperMod theme submodule (themes/PaperMod). Before merging, review the theme's changes,
  # and diff the theme files this repo overrides: layouts/_partials/footer.html (against the
  # footer override and assets/js/site.js, see "Security headers" in DEPLOY.md) and
  # layouts/single.html, layouts/list.html and layouts/_partials/post_meta.html (numbered headings,
  # tags, post numbers; see STYLE.md), layouts/404.html, layouts/_partials/index_profile.html (home
  # page tagline), and layouts/_partials/templates/schema_json.html and
  # templates/_funcs/get-page-images.html (structured data and social cards).
  # Pull requests get a build-only check from hugo.yaml, so a theme update that breaks the build
  # shows a red X before merging.
  # Also check the theme hasn't added its own layouts/_markup/render-link.html (ours renders accents).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
