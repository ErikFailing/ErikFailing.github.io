<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same monogram for the iOS home screen: square corners and no edge (iOS rounds the corners
       itself, which would cut an edge unevenly) and an opaque background (iOS fills transparency with
       black). Source for static/apple-touch-icon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d212a"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#bg)"/>
  <!-- E -->
  <g fill="#00b2ff">
    <rect x="4" y="6" width="4" height="20"/>
    <rect x="4" y="6" width="10" height="4"/>
    <rect x="4" y="14" width="8" height="4"/>
    <rect x="4" y="22" width="10" height="4"/>
  </g>
  <!-- F -->
  <g fill="#00e676">
    <rect x="18" y="6" width="4" height="20"/>
    <rect x="18" y="6" width="10" height="4"/>
    <rect x="18" y="14" width="8" height="4"/>
  </g>
</svg>
