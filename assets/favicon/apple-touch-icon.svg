<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 20 20" width="180" height="180">
  <!-- Same monogram for the iOS home screen: square corners (iOS rounds them itself) and extra
       padding. Source for static/apple-touch-icon.png (180x180). -->
  <rect x="-2" y="-2" width="20" height="20" fill="#1a1320"/>
  <g fill="#e7a3b8">
    <rect x="2" y="3" width="2" height="10"/>
    <rect x="2" y="3" width="5" height="2"/>
    <rect x="2" y="7" width="4" height="2"/>
    <rect x="2" y="11" width="5" height="2"/>
    <rect x="9" y="3" width="2" height="10"/>
    <rect x="9" y="3" width="5" height="2"/>
    <rect x="9" y="7" width="4" height="2"/>
  </g>
</svg>
