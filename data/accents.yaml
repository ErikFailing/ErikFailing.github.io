# Accent palette: the colors for highlighting the important parts of a page, inspired by the
# colored keywords in Caves of Qud. See "Accents" in STYLE.md for how to choose and place them.
#
# In Markdown, accent a word, phrase or sentence like this:
#
#   {=ward: the build pipeline=}              a colored accent (any style below)
#   {=point: this is the one point to keep=}  the key-point accent
#
# {= =} are passthrough delimiters (hugo.toml), so GitHub shows accents as plain text.
# layouts/_markup/render-passthrough.html turns them into <span class="accent accent-NAME">, and
# fails the build on a malformed accent or a style that isn't listed here. The CSS for each style is
# generated from this file by assets/css/accent-styles.css; shared rules are in
# assets/css/extended/accents.css.
#
# `colors`: one hex color (solid) or two (a left-to-right gradient). Keep it mostly solid:
# gradients are for signature styles only (about 1 in 5), so they stay special. Every color, and
# every point along a gradient, must reach 7:1 contrast on the #08090c background; brand colors
# that are too dark get lightened (keeping their hue) until they do. Solid blues are fine: links
# are always underlined and accents never are.
#
# `use`: when to pick the style, including the tools and terms it's the right choice for.

styles:
  # ---- Tier 1: the key point ----
  point:      { use: "The one takeaway of a section: the sentence or phrase a skimming reader must not miss. At most one per section. Keep it to the core phrase (about 10 words at most). Bright italic at a medium weight, no hue." }

  # ---- Tier 2: vibes (anything that isn't a named tool, company, person or place) ----
  crimson:    { colors: ["#ff6b6b"], use: "Attacking and offensive work: pentesting, red teaming, phishing, email spoofing, domain or subdomain takeover, authentication bypass, SSRF, attack surface, a risk being exploited" }
  blaze:      { colors: ["#ff6b6b", "#ff9f43"], use: "Something on fire, high impact: remote code execution (RCE), exploit development, a serious breach" }
  glitch:     { colors: ["#ff6ad5", "#ff6b6b"], use: "Unknown, corrupted, dangerous or absurd: zero-days, memory corruption, dependency confusion, mistakes made with total confidence" }
  toxic:      { colors: ["#a6e35b", "#d279eb"], use: "Poison slipped in: SQL injection, command injection, cross-site scripting (XSS)" }
  ascend:     { colors: ["#ff9f43"], use: "Climbing up or breaking out: privilege escalation, sandbox escapes" }
  flood:      { colors: ["#5cc8ff"], use: "Water spilling over: buffer and integer overflows" }
  ghostly:    { colors: ["#e4e2f5", "#b69cff"], use: "Haunted or invisible: use-after-free, clickjacking, CSRF, side-channel attacks" }
  static:     { colors: ["#4fd8e0", "#ff6ad5"], use: "Noise and chaos: fuzzing, fuzzers, AFL++, libFuzzer, race conditions, concurrency, visual glitches like a font swap" }
  arcane:     { colors: ["#b69cff"], use: "Secrets, deep knowledge and AI: reverse engineering, static analysis, cryptography and encryption, post-quantum crypto, SHA-256 and checksums, subresource integrity, LLMs, local LLMs, Ollama" }
  trophy:     { colors: ["#ffd166"], use: "Winning and proving it: CTFs, capture the flag, proofs of concept, bug bounties, game jams, hackathons, scores and grades" }
  ward:       { colors: ["#3fd68a"], use: "Shields up, defenses: defense in depth, least privilege, threat modeling, memory safety, secure code review, CSP, HSTS, DNSSEC, SPF and DMARC, zero trust, MFA and passkeys, secrets management, coordinated disclosure, vulnerability reporting" }
  iron:       { colors: ["#a9b8cc"], use: "Metal and machinery: supply chain, SBOMs, the plumbing of a system, black-and-white brands (Unreal Engine, Unity, Squarespace, GitHub)" }
  flow:       { colors: ["#4fd8e0"], use: "Things moving through pipes: CI/CD, GitHub Actions, GitHub Pages, Dependabot, infrastructure as code, build and deploy steps, unit tests, REST APIs" }
  clarity:    { colors: ["#ffe08a"], use: "Light and legibility: WCAG, accessibility, readability, typography and fonts" }

