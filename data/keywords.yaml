# Keyword coloring, inspired by the color templates in Caves of Qud.
#
# Nothing here is colored on its own. Each page picks its own terms in front matter, so every page
# can be balanced for its length and theme:
#
#   colorKeywords = ["fuzzing", "supply chain"]     # terms from the library below (any form works)
#   colorKeywordsCustom = { "AFL++" = "flood" }     # page-only terms: "text" = "style"
#
# The library keeps colors consistent: a term has the same color on every page that picks it.
# layouts/_partials/keyword_colors.html does the coloring at build time, and the CSS for every
# style is generated from `styles` below by assets/css/keyword-styles.css. The shared rules
# (gradient painting, fallbacks) are in assets/css/extended/keywords.css.
#
# Rules the partial enforces:
# - Only the first mention of each picked term is colored.
# - Never inside code, links, headings, tables, buttons or HTML attributes, and never in titles,
#   summaries or the RSS feed (only the rendered page body is processed).
# - Whole words only, any capitalization; the original capitalization is kept. So avoid forms that
#   are also everyday words (e.g. "Go" for the language: use "Golang").
# - The build fails if a page picks a term that isn't in the library or a style that doesn't
#   exist, and warns if a picked term never got colored.
#
# Adding a style: `colors` is one hex color (solid) or two (a left-to-right gradient). Keep it
# mostly solid: gradients are for signature terms only (about 1 style in 5), so they stay special.
# Every color, and every point along a gradient, must reach 7:1 contrast on the #08090c page
# background; brand colors that are too dark get lightened (keeping their hue) until they do.
# Solid blues are fine: links are always underlined and keywords never are.
#
# Adding a library term: an entry with one or more `match` forms (plural, hyphenated, acronym, etc.)
# and the `style` that fits: the brand's colors for a tool or language, otherwise the closest vibe.

